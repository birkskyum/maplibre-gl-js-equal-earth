<!DOCTYPE html>
<html lang="en">
<head>
    <title>Explore Equal Earth projection modes</title>
    <meta property="og:description" content="Display an Equal Earth world map that transitions to Mercator as you zoom in." />
    <meta property="og:category" content="Styles" />
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="../../dist/maplibre-gl.css" />
    <style>
        body { margin: 0; padding: 0; }
        html, body, #map { height: 100%; }
        #description { position: absolute; top: 12px; left: 12px; max-width: calc(100% - 90px); padding: 12px; background: white; font: 14px sans-serif; border-radius: 4px; }
        #controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 10px; }
        #mode-control { display: grid; gap: 5px; margin-top: 12px; }
        select { max-width: 100%; padding: 6px; font: inherit; }
        #mode-hint, #origin-status { display: block; margin-top: 8px; font-size: 12px; color: #555; }
        #origin-status[hidden] { display: none; }
        button { padding: 6px 10px; cursor: pointer; }
        #terrain-status { display: block; margin-top: 8px; color: #555; font-size: 12px; }
    </style>
</head>
<body>
<div id="map"></div>
<div id="description">
    <strong>Equal Earth · OpenFreeMap Liberty</strong>
    <div id="mode-control">
        <label for="mode">Projection mode</label>
        <select id="mode">
            <option value="adaptive">Adaptive · Mercator at zoom 7</option>
            <option value="fixed">Fixed · Equal Earth at every zoom</option>
            <option value="fixed-origin">Fixed · drag origin in any direction</option>
            <option value="adaptive-origin">Adaptive · drag origin east or west</option>
        </select>
    </div>
    <div id="controls">
        <button id="world">World</button>
        <button id="alps">Alps · 3D</button>
        <label><input id="terrain" type="checkbox" checked> Terrain</label>
        <a href="https://github.com/birkskyum/maplibre-gl-js-equal-earth" target="_blank" rel="noopener noreferrer">Source on GitHub</a>
    </div>
    <span id="mode-hint"></span>
    <span id="origin-status" hidden></span>
    <span id="terrain-status">Loading terrain…</span>
</div>
<script type="module">
    import * as maplibregl from '../../dist/maplibre-gl-dev.mjs';

    const map = new maplibregl.Map({
        container: 'map',
        style: 'https://tiles.openfreemap.org/styles/liberty',
        center: [0, 0],
        zoom: 1,
        maxPitch: 85
    });
    const modeSelect = document.getElementById('mode');
    const modeHint = document.getElementById('mode-hint');
    const originStatus = document.getElementById('origin-status');
    const terrainToggle = document.getElementById('terrain');
    const terrainStatus = document.getElementById('terrain-status');
    const alpsButton = document.getElementById('alps');
    const requestedMode = new URL(location.href).searchParams.get('mode');
    if ([...modeSelect.options].some(option => option.value === requestedMode)) modeSelect.value = requestedMode;
    let origin = [0, 0];
    let dragging;
    let dragFrame;
    let originControls;
    let centeredZoom;

    /** Returns the current demo mode's adaptive and origin behavior. */
    function settings() {
        return {adaptive: modeSelect.value.startsWith('adaptive'), movable: modeSelect.value.endsWith('origin')};
    }

    /** Applies experimental projection parameters while keeping the existing map and style. */
    function updateProjection() {
        const {adaptive, movable} = settings();
        map.setProjection({type: 'equal-earth', ...(adaptive ? {} : {transition: false}), ...(movable ? {center: origin} : {})});
        modeHint.textContent = movable ? adaptive ? 'Drag east or west to shift the origin. Zoom toward the cursor anywhere on the map.'
            : 'Drag in any direction to move the origin, including to either pole.'
            : adaptive ? 'Equal Earth transitions to Mercator from zoom 6 to 7.' : 'Equal Earth stays active at every zoom. Drag to pan the map.';
        originStatus.hidden = !movable;
        originStatus.textContent = `Origin · ${origin[0].toFixed(1)}° longitude, ${origin[1].toFixed(1)}° latitude`;
        terrainToggle.disabled = !adaptive;
        alpsButton.textContent = adaptive ? 'Alps · 3D' : 'Alps';
        updateTerrain();
        updateControls();
    }

    /** Grows terrain only after an adaptive mode reaches Mercator. */
    function updateTerrain() {
        if (!map.getSource('terrain')) return;
        const adaptive = settings().adaptive;
        const enabled = adaptive && terrainToggle.checked && map.getZoom() >= 7;
        const t = Math.max(0, Math.min(1, (map.getZoom() - 7) / 2));
        const exaggeration = 1.3 * t * t * (3 - 2 * t);
        const current = map.getTerrain();
        if (enabled && current?.exaggeration !== exaggeration) map.setTerrain({source: 'terrain', exaggeration});
        else if (!enabled && current) map.setTerrain(null);
        terrainStatus.textContent = !adaptive ? 'Hillshade · 3D terrain needs Mercator'
            : !terrainToggle.checked ? 'Hillshade · 3D terrain off'
                : enabled ? `3D terrain · ${exaggeration.toFixed(2)}× elevation` : 'Hillshade · terrain rises smoothly from zoom 7 to 9';
    }

    /** Fixed origin mode zooms around its origin; adaptive modes zoom around the cursor or gesture. */
    function updateControls() {
        const {adaptive, movable} = settings();
        const active = movable && (!adaptive || map.getZoom() < 7);
        const zoomAtCenter = movable && !adaptive;
        if (centeredZoom !== zoomAtCenter) {
            centeredZoom = zoomAtCenter;
            map.scrollZoom.disable();
            map.scrollZoom.enable(zoomAtCenter ? {around: 'center'} : {});
            map.touchZoomRotate.disable();
            map.touchZoomRotate.enable(zoomAtCenter ? {around: 'center'} : {});
        }
        if (active === originControls) return;
        originControls = active;
        if (active) map.dragPan.disable();
        else map.dragPan.enable();
        map.getCanvas().style.cursor = active ? 'grab' : '';
    }

    /** Rotates at most once per animation frame as the pointer moves. */
    function applyDrag() {
        dragFrame = undefined;
        if (!dragging) return;
        const scale = 512 * Math.pow(2, map.getZoom());
        const longitude = dragging.origin[0] - (dragging.x - dragging.startX) * 360 / scale;
        const latitude = settings().adaptive ? 0 : dragging.origin[1] + (dragging.y - dragging.startY) * 268 / scale;
        origin = [((longitude + 180) % 360 + 360) % 360 - 180, Math.max(-90, Math.min(90, latitude))];
        updateProjection();
        const centerLongitude = dragging.center.lng + longitude - dragging.origin[0];
        const center = settings().adaptive ? [((centerLongitude + 180) % 360 + 360) % 360 - 180, dragging.center.lat] : origin;
        map.jumpTo({center, bearing: 0, pitch: 0});
    }

    map.getCanvas().addEventListener('pointerdown', event => {
        if (!originControls || event.button !== 0) return;
        event.preventDefault();
        map.stop();
        dragging = {startX: event.clientX, startY: event.clientY, x: event.clientX, y: event.clientY, origin: [...origin], center: map.getCenter()};
        map.getCanvas().setPointerCapture(event.pointerId);
        map.getCanvas().style.cursor = 'grabbing';
    });
    map.getCanvas().addEventListener('pointermove', event => {
        if (!dragging) return;
        dragging.x = event.clientX;
        dragging.y = event.clientY;
        dragFrame ??= requestAnimationFrame(applyDrag);
    });
    for (const eventName of ['pointerup', 'pointercancel']) map.getCanvas().addEventListener(eventName, () => {
        if (!dragging) return;
        if (dragFrame !== undefined) cancelAnimationFrame(dragFrame);
        applyDrag();
        dragging = undefined;
        map.getCanvas().style.cursor = originControls ? 'grab' : '';
    });
    modeSelect.addEventListener('change', () => {
        map.stop();
        const {movable, adaptive} = settings();
        origin = movable ? [map.getCenter().wrap().lng, adaptive ? 0 : map.getCenter().lat] : [0, 0];
        updateProjection();
        map.jumpTo({center: movable && !adaptive ? origin : map.getCenter(), pitch: 0, bearing: 0});
        const url = new URL(location.href);
        url.searchParams.set('mode', modeSelect.value);
        history.replaceState(null, '', url);
    });

    map.on('style.load', () => {
        updateProjection();
        map.addSource('terrain', {type: 'raster-dem', url: 'https://tiles.mapterhorn.com/tilejson.json'});
        map.addSource('hillshade', {type: 'raster-dem', url: 'https://tiles.mapterhorn.com/tilejson.json'});
        const firstSymbol = map.getStyle().layers.find(layer => layer.type === 'symbol');
        map.addLayer({
            id: 'terrain-hillshade',
            type: 'hillshade',
            source: 'hillshade',
            paint: {
                'hillshade-shadow-color': '#473b24',
                'hillshade-exaggeration': ['interpolate', ['linear'], ['zoom'], 0, 0.25, 6, 0.35]
            }
        }, firstSymbol?.id);
        map.setSky({});
        updateTerrain();
    });
    map.on('zoom', () => { updateTerrain(); updateControls(); });
    terrainToggle.addEventListener('change', updateTerrain);
    document.getElementById('world').addEventListener('click', () => {
        origin = [0, 0];
        updateProjection();
        map.flyTo({center: [0, 0], zoom: 1, pitch: 0, bearing: 0, duration: 2500});
    });
    document.getElementById('alps').addEventListener('click', () => {
        terrainToggle.checked = true;
        const {adaptive, movable} = settings();
        if (movable) { origin = [11.39085, adaptive ? 0 : 47.27574]; updateProjection(); }
        map.flyTo({center: [11.39085, 47.27574], zoom: 12, pitch: adaptive ? 65 : 0, bearing: adaptive ? -20 : 0, duration: 2500});
        updateTerrain();
    });
    map.addControl(new maplibregl.NavigationControl({visualizePitch: true}));
</script>
</body>
</html>
